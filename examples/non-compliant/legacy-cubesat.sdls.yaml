# A deliberately misconfigured SA database, modelled on mistakes that are
# easy to make when SDLS is bolted onto an existing mission. Every SA here
# is wrong in at least one way; the exact findings are in expected.json.
apiVersion: sdls.portfolio/v1
kind: SecurityAssociationDatabase
metadata:
  mission: LEGACYSAT-2
  owner: ops@example.org
  legacy_implementation: false   # claims to be new, so 352.0-B-2 §3.2.1 applies

virtual_channels:
  - name: tc-commands
    protocol: TC
    gvcid: { tfvn: 0, scid: 77, vcid: 0 }
    carries: telecommand
    cop: true
  - name: tc-software-upload
    protocol: TC
    gvcid: { tfvn: 0, scid: 77, vcid: 3 }
    carries: telecommand
    cop: true
  - name: tm-housekeeping
    protocol: TM
    gvcid: { tfvn: 0, scid: 77, vcid: 0 }
    carries: telemetry
    cop: false
  - name: tm-idle
    protocol: TM
    gvcid: { tfvn: 0, scid: 77, vcid: 7 }
    carries: idle_only
    cop: false

security_associations:
  # Uplink "secured" with encryption only: confidentiality, but no
  # authentication and therefore no anti-replay. Also a 128-bit key.
  - spi: 0
    description: Telecommand uplink
    protocol: TC
    gvcids:
      - { tfvn: 0, scid: 77, vcid: 0 }
      - { tfvn: 0, scid: 77, vcid: 3 }
    service: encryption
    algorithm: { cipher: AES, mode: CBC, key_bits: 128 }
    iv_length_octets: 16
    sequence_number: { length_octets: 0, window: 0 }
    pad_length_octets: 1
    mac_length_octets: 0
    key_hex: "00112233445566778899aabbccddeeff"

  # Telemetry authenticated with HMAC-SHA-1, truncated tag, no window.
  - spi: 5
    description: Housekeeping telemetry
    protocol: TM
    gvcids:
      - { tfvn: 0, scid: 77, vcid: 0 }
      - { tfvn: 0, scid: 77, vcid: 7 }
    service: authentication
    algorithm: { mac: HMAC, hash: SHA-1, key_bits: 160 }
    iv_length_octets: 0
    sequence_number: { length_octets: 4, window: 0 }
    pad_length_octets: 0
    mac_length_octets: 10
    key_ref: file:///opt/keys/tm.key
